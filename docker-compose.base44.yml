services:
  web:
    image: oven/bun:1.4.2
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - base44_node_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun --watch server.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/', {signal: AbortSignal.timeout(4000)}); const text = await r.text(); if (!r.ok || !text.includes('/@vite/client')) { console.error('Frontend/backend entry point failed'); process.exit(1); }"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  base44_node_modules:
