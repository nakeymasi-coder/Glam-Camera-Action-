services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    command: ["sh", "-ec", "npm install --global bun@1.4.2 && bun install --frozen-lockfile && exec node --import tsx --watch-path=server.ts server.ts"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/', '/src/main.tsx'].map(async path => { const r = await fetch('http://127.0.0.1:3000' + path, {signal: AbortSignal.timeout(4000)}); if (!r.ok) throw Error(path + ' failed: ' + r.status); })).catch(e => { console.error(e.message); process.exit(1); })"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  dependencies:
