services:
  web:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: ["sh", "-ec", "npm install -g bun@1.3.14 && bun install --frozen-lockfile && exec env -u GEMINI_API_KEY bun run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(async r=>{if(!r.ok || !(await r.text()).includes('/src/main.tsx'))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  node_modules:
